name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test backend with PostgreSQL Testcontainers
        run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-report
          path: build/reports/tests/test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary JWT secret
        run: echo "JWT_SECRET_BASE64=$(openssl rand -base64 32)" > .env
      - name: Build and start clean stack
        run: docker compose up --build -d
      - name: Wait for backend migrations
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS 'http://localhost:8080/api/v1/products?size=1' > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Seed clean database
        run: |
          docker compose cp scripts/demo-data.sql postgres:/tmp/demo-data.sql
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /tmp/demo-data.sql'
      - name: Upload and check demo images
        shell: pwsh
        run: |
          ./scripts/seed-demo-images.ps1
          ./scripts/verify-demo.ps1 -CheckImages
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down
